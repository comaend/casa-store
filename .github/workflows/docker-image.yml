# Baut das STREAMFLIX-Image (arm64 + amd64), veröffentlicht es in ghcr.io und
# trägt deinen GitHub-Namen automatisch in Apps/Streamflix/docker-compose.yml ein.
name: build-image
on:
  push:
    branches: [main]
    paths:
      - "streamflix-src/**"
      - "Apps/**"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Platzhalter in der Compose-Datei ersetzen
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          F=Apps/Streamflix/docker-compose.yml
          sed -i "s|GITHUB_OWNER_RAW|${GITHUB_REPOSITORY_OWNER}|g; s|GITHUB_OWNER|${OWNER}|g; s|GITHUB_REPO|${REPO}|g" "$F"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Eigenen GitHub-Namen in docker-compose.yml eingetragen"
            git push
          fi

      - name: Version aus der Compose-Datei lesen
        id: v
        run: echo "version=$(grep -oP 'streamflix:\K[0-9][^\s"]*' Apps/Streamflix/docker-compose.yml | head -1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Owner kleinschreiben
        id: o
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: streamflix-src
          platforms: linux/arm64,linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.o.outputs.owner }}/streamflix:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.o.outputs.owner }}/streamflix:latest
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

